name: Build OpenWrt

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'OpenWrt branch (e.g., chaos_calmer for 15.05, openwrt-17.01 for 17.01)'
        required: true
        default: 'openwrt-17.01'
      target:
        description: 'Target (e.g., brcm63xx/generic)'
        required: true
        default: 'brcm63xx/generic'
      profile:
        description: 'Profile (e.g., HG556a_C)'
        required: true
        default: 'HG556a_C'

jobs:
  build:
    runs-on: ubuntu-20.04  # 推荐 20.04，兼容老版本依赖
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential subversion git libncurses5-dev zlib1g-dev gawk flex quilt libssl-dev xsltproc libxml-parser-perl unzip mercurial python2.7-dev time unzip wget python-distutils-extra

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure (use defconfig for profile)
        run: |
          make defconfig
          # 或自定义 config（可选）
          # echo "CONFIG_TARGET_brcm63xx=y" >> .config
          # echo "CONFIG_TARGET_brcm63xx_generic=y" >> .config
          # echo "CONFIG_TARGET_brcm63xx_generic_HG556a_C=y" >> .config
          # make defconfig

      - name: Build firmware
        run: make -j$(nproc) V=s

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-firmware-${{ github.event.inputs.branch }}
          path: bin/targets/${{ github.event.inputs.target }}/*
